services:
  frontend:
    build:
      context: ./front-road-management-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://18.192.25.99:3001
    image: road-management-frontend:${TAG:-latest}
    ports:
      - "${FRONTEND_PORT:-80}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_URL=http://18.192.25.99:3001
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      - database

  database:
    build:
      context: ./db-road-management-app
      dockerfile: Dockerfile
    image: road-management-db:${TAG:-latest}
    ports:
      - '${DB_PORT:-3001}:3001'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    volumes:
      - db_data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/health']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

volumes:
  db_data:
