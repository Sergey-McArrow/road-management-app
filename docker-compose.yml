services:
  frontend:
    build:
      context: ./front-road-management-app
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://18.192.25.99:3001
    image: road-management-frontend:${TAG:-latest}
    ports:
      - '${FRONTEND_PORT:-80}:3000'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_URL=http://18.192.25.99:3001
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    depends_on:
      database:
        condition: service_healthy

  database:
    build:
      context: ./db-road-management-app
      dockerfile: Dockerfile
    image: road-management-db:${TAG:-latest}
    ports:
      - '${DB_PORT:-3001}:3001'
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    networks:
      - app-network
    volumes:
      - db_data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:3001/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
